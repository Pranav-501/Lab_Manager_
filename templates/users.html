{% extends "base.html" %}
{% block heading %}User Management{% endblock %}
{% block content %}
<div class="card"><div class="cardhead"><h2>Create User</h2></div><form class="formgrid" method="post" action="{{url_for('add_user')}}"><input name="name" placeholder="Full name" required><input type="email" name="email" placeholder="Email" required><input name="password" placeholder="Password" required><select name="role"><option>staff</option><option>admin</option></select><button class="btn primary">Create User</button></form></div>
<div class="card"><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th></tr></thead><tbody>{% for u in users %}<tr><td><b>{{u.name}}</b></td><td>{{u.email}}</td><td><span class="badge">{{u.role}}</span></td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
